<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F2"/><stop offset="0.5" stop-color="#F6DDE4"/><stop offset="1" stop-color="#DED3F0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E4378"/><stop offset="1" stop-color="#4B3360"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0C68E"/><stop offset="1" stop-color="#C4A366"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4B3360" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 530) scale(1.06) translate(-512 -485)">
  <!-- antenna -->
  <line x1="512" y1="268" x2="512" y2="196" stroke="#C9AA6E" stroke-width="22" stroke-linecap="round"/>
  <path d="M512 118 L556 162 L512 206 L468 162 Z" fill="url(#gold)"/>
  <!-- chat-bubble head -->
  <g filter="url(#sh)">
    <path d="M300 262 H724 Q838 262 838 376 V626 Q838 740 724 740 H520 L392 852 L410 740 H300 Q186 740 186 626 V376 Q186 262 300 262 Z" fill="url(#head)"/>
  </g>
  <!-- gold hairline inside the bubble -->
  <path d="M306 296 H718 Q804 296 804 382 V620 Q804 706 718 706 H508 L436 768 L446 706 H306 Q220 706 220 620 V382 Q220 296 306 296 Z" fill="none" stroke="#C4A366" stroke-width="6" opacity="0.85"/>
  <!-- face screen -->
  <rect x="274" y="356" width="476" height="290" rx="120" fill="#FBF7F2"/>
  <!-- eyes -->
  <ellipse cx="410" cy="476" rx="40" ry="52" fill="#4B3360"/>
  <ellipse cx="614" cy="476" rx="40" ry="52" fill="#4B3360"/>
  <circle cx="424" cy="456" r="13" fill="#FFFFFF"/>
  <circle cx="628" cy="456" r="13" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="342" cy="560" rx="34" ry="20" fill="#D63A6E" opacity="0.35"/>
  <ellipse cx="682" cy="560" rx="34" ry="20" fill="#D63A6E" opacity="0.35"/>
  <!-- smile -->
  <path d="M462 566 Q512 612 562 566" fill="none" stroke="#4B3360" stroke-width="20" stroke-linecap="round"/>
  <!-- ear bolts -->
  <rect x="150" y="440" width="44" height="124" rx="22" fill="url(#gold)"/>
  <rect x="830" y="440" width="44" height="124" rx="22" fill="url(#gold)"/>
  </g>
</svg>
